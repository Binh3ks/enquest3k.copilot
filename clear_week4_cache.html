<!DOCTYPE html>
<html>
<head><title>Clear Week 4 Cache</title></head>
<body>
<h1>Clearing Week 4 Cache...</h1>
<script>
// Clear all storage
localStorage.clear();
sessionStorage.clear();

// Clear IndexedDB
indexedDB.databases().then(dbs => {
  dbs.forEach(db => indexedDB.deleteDatabase(db.name));
});

// Clear service worker cache
if ('caches' in window) {
  caches.keys().then(names => {
    names.forEach(name => caches.delete(name));
  });
}

document.body.innerHTML = '<h1 style="color: green">✅ Cache cleared! Close this tab and hard refresh (Cmd+Shift+R) the app.</h1>';
console.log('✅ All cache cleared');
</script>
</body>
</html>
