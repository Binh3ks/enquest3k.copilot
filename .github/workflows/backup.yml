name: Database Backup

on:
  # Every 15 minutes (minimum for free GitHub Actions)
  schedule:
    - cron: '*/15 * * * *'
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Push to main: run backup immediately
  push:
    branches: [main]

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/backup_db.cjs
            mcp-server/node_modules/pg
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pg
        run: npm install pg 2>/dev/null

      - name: Run backup
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          BACKUP_OUTPUT_DIR: ${{ github.workspace }}/backup_latest
        run: node scripts/backup_db.cjs --latest

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout backup 2>/dev/null || git checkout --orphan backup
          git checkout -- .
          git clean -fd

      - name: Commit backup
        run: |
          set -e
          BACKUP_DIR="${{ github.workspace }}/backup_latest"
          mkdir -p backup_history
          cp -r "$BACKUP_DIR"/* backup_history/
          # Keep last 48 backups (12 hours at 15min intervals)
          ls -dt backup_history/*/ | tail -n +49 | xargs -r rm -rf
          git add -A
          CHANGES=$(git status --porcelain)
          if [ -z "$CHANGES" ]; then
            echo "No changes — backup unchanged"
          else
            git commit -m "backup: $(date +%Y-%m-%d\ %H:%M)"
            git push origin backup --force
            echo "Backup pushed successfully"
          fi
