<!DOCTYPE html>
<html>
<head>
    <title>Clear Week 7 Cache</title>
</head>
<body>
    <h1>Clearing Week 7 Cache...</h1>
    <div id="status"></div>
    <script>
        const status = document.getElementById('status');
        
        // Clear localStorage
        const keysToDelete = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.includes('week7') || key.includes('week_7')) {
                keysToDelete.push(key);
            }
        }
        keysToDelete.forEach(key => localStorage.removeItem(key));
        
        // Clear sessionStorage
        const sessionKeysToDelete = [];
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            if (key && (key.includes('week7') || key.includes('week_7'))) {
                sessionKeysToDelete.push(key);
            }
        }
        sessionKeysToDelete.forEach(key => sessionStorage.removeItem(key));
        
        // Clear all caches
        if ('caches' in window) {
            caches.keys().then(names => {
                names.forEach(name => caches.delete(name));
            });
        }
        
        status.innerHTML = `
            <p>✅ Cleared ${keysToDelete.length} localStorage keys</p>
            <p>✅ Cleared ${sessionKeysToDelete.length} sessionStorage keys</p>
            <p>✅ Cleared all caches</p>
            <p><strong>Reload app now!</strong></p>
        `;
    </script>
</body>
</html>
