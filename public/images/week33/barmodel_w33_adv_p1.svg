<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Title / Badge -->
  <rect x="20" y="15" width="160" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="100" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">PART-WHOLE MODEL</text>

  <!-- Total Bracket Top -->
  <path d="M 50 70 L 50 55 L 250 55 L 250 45 L 250 55 L 450 55 L 450 70" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">Total Corridor: 100 meters</text>

  <!-- Bar 1: Walked (40m) -->
  <g filter="url(#shadow)">
    <rect x="50" y="75" width="160" height="55" rx="8" fill="url(#blueGrad)" stroke="#1e3a8a" stroke-width="2" />
    <text x="130" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Walked</text>
    <text x="130" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#dbeafe" text-anchor="middle">40 meters</text>
  </g>

  <!-- Bar 2: Remaining (? m) -->
  <g filter="url(#shadow)">
    <rect x="210" y="75" width="240" height="55" rx="8" fill="url(#amberGrad)" stroke="#b45309" stroke-width="2" />
    <text x="330" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Remaining Distance</text>
    <text x="330" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#fef3c7" text-anchor="middle">? meters</text>
  </g>

  <!-- Bottom Bracket Hint -->
  <path d="M 210 140 L 210 152 L 330 152 L 330 160 L 330 152 L 450 152 L 450 140" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <text x="330" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">Target: 100 - 40 = ?</text>
</svg>
