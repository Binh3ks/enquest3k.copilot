<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect x="20" y="15" width="180" height="24" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" />
  <text x="110" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#581c87" text-anchor="middle">TOTAL TREATMENT TIME</text>

  <!-- Part 1 Bar: Rested (15m) -->
  <g filter="url(#shadow3)">
    <rect x="50" y="65" width="240" height="55" rx="8" fill="url(#purpleGrad)" stroke="#4c1d95" stroke-width="2" />
    <text x="170" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Rested</text>
    <text x="170" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f3e8ff" text-anchor="middle">15 minutes</text>
  </g>

  <!-- Part 2 Bar: Applied Ice (10m) -->
  <g filter="url(#shadow3)">
    <rect x="290" y="65" width="160" height="55" rx="8" fill="url(#cyanGrad)" stroke="#164e63" stroke-width="2" />
    <text x="370" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Ice Pack</text>
    <text x="370" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#cffafe" text-anchor="middle">10 minutes</text>
  </g>

  <!-- Total Bottom Bracket -->
  <path d="M 50 130 L 50 145 L 250 145 L 250 155 L 250 145 L 450 145 L 450 130" fill="none" stroke="#4c1d95" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#4c1d95" text-anchor="middle">Total Time: 15 + 10 = ? minutes</text>
</svg>
