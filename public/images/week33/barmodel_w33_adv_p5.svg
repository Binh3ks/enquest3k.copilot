<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect x="20" y="15" width="200" height="24" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" />
  <text x="120" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">EQUAL PARTS MULTIPLICATION</text>

  <!-- 4 Equal Unit Bars -->
  <g filter="url(#shadow5)" transform="translate(50, 65)">
    <!-- Unit 1 -->
    <rect x="0" y="0" width="95" height="55" rx="8" fill="url(#starGrad)" stroke="#b45309" stroke-width="2" />
    <text x="47" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle">Helper 1</text>
    <text x="47" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">5 ⭐</text>

    <!-- Unit 2 -->
    <rect x="100" y="0" width="95" height="55" rx="8" fill="url(#starGrad)" stroke="#b45309" stroke-width="2" />
    <text x="147" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle">Helper 2</text>
    <text x="147" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">5 ⭐</text>

    <!-- Unit 3 -->
    <rect x="200" y="0" width="95" height="55" rx="8" fill="url(#starGrad)" stroke="#b45309" stroke-width="2" />
    <text x="247" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle">Helper 3</text>
    <text x="247" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">5 ⭐</text>

    <!-- Unit 4 -->
    <rect x="300" y="0" width="95" height="55" rx="8" fill="url(#starGrad)" stroke="#b45309" stroke-width="2" />
    <text x="347" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle">Helper 4</text>
    <text x="347" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">5 ⭐</text>
  </g>

  <!-- Total Bottom Bracket -->
  <path d="M 50 135 L 50 150 L 250 150 L 250 160 L 250 150 L 445 150 L 445 135" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#b45309" text-anchor="middle">Total Safety Stars: 4 × 5 = ? stars</text>
</svg>
