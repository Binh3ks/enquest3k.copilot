<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect x="20" y="15" width="160" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="100" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#312e81" text-anchor="middle">PART-WHOLE MODEL</text>

  <!-- Total Top Bracket -->
  <path d="M 50 70 L 50 55 L 250 55 L 250 45 L 250 55 L 450 55 L 450 70" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">Total Class 4A: 30 Students</text>

  <!-- Bar 1: Followed Rules (24) -->
  <g filter="url(#shadow4)">
    <rect x="50" y="75" width="310" height="55" rx="8" fill="url(#indigoGrad)" stroke="#312e81" stroke-width="2" />
    <text x="205" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Followed Safety Rules</text>
    <text x="205" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e0e7ff" text-anchor="middle">24 students</text>
  </g>

  <!-- Bar 2: Ran in corridor (? students) -->
  <g filter="url(#shadow4)">
    <rect x="360" y="75" width="90" height="55" rx="8" fill="url(#orangeGrad)" stroke="#7c2d12" stroke-width="2" />
    <text x="405" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Ran</text>
    <text x="405" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffedd5" text-anchor="middle">?</text>
  </g>

  <text x="250" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#c2410c" text-anchor="middle">Calculate: 30 - 24 = ? students</text>
</svg>
