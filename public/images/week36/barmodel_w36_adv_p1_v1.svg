<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <rect width="600" height="220" fill="#f8fafc" rx="12"/>
  <text x="300" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Part-Whole Bar Model: Total Gold Coins</text>
  
  <!-- Total Bracket Top -->
  <path d="M 50 65 L 50 55 L 550 55 L 550 65 M 300 55 L 300 45" stroke="#2563eb" stroke-width="3" fill="none"/>
  <text x="300" y="40" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Total = 100 coins</text>

  <!-- Part 1: Food (40%) -->
  <rect x="50" y="70" width="200" height="60" fill="#f59e0b" rx="6" stroke="#d97706" stroke-width="2"/>
  <text x="150" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Food</text>
  <text x="150" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">40 coins</text>

  <!-- Part 2: Supplies (25%) -->
  <rect x="252" y="70" width="125" height="60" fill="#8b5cf6" rx="6" stroke="#7c3aed" stroke-width="2"/>
  <text x="314" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Supplies</text>
  <text x="314" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">25 coins</text>

  <!-- Part 3: Left (? = 35%) -->
  <rect x="379" y="70" width="171" height="60" fill="#10b981" rx="6" stroke="#059669" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="464" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Coins Left</text>
  <text x="464" y="120" font-family="sans-serif" font-size="16" font-weight="extrabold" fill="#ffffff" text-anchor="middle">?</text>

  <!-- Equation Hint Bottom -->
  <text x="300" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Equation: 100 - 40 - 25 = ?</text>
</svg>
