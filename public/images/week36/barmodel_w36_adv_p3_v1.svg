<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <rect width="600" height="220" fill="#f8fafc" rx="12"/>
  <text x="300" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Part-Whole Bar Model: Submarine Depth</text>

  <!-- Total Bracket Top -->
  <path d="M 50 65 L 50 55 L 550 55 L 550 65 M 300 55 L 300 45" stroke="#2563eb" stroke-width="3" fill="none"/>
  <text x="300" y="40" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Total Initial Depth = 300 metres</text>

  <!-- Part 1: Ascended (150m) -->
  <rect x="50" y="70" width="250" height="60" fill="#8b5cf6" rx="6" stroke="#6d28d9" stroke-width="2"/>
  <text x="175" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Ascended (Came Up)</text>
  <text x="175" y="120" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">150 metres</text>

  <!-- Part 2: Current Depth (? = 150m) -->
  <rect x="302" y="70" width="248" height="60" fill="#0284c7" rx="6" stroke="#0369a1" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="426" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Current Depth</text>
  <text x="426" y="120" font-family="sans-serif" font-size="16" font-weight="extrabold" fill="#ffffff" text-anchor="middle">? metres</text>

  <!-- Equation Hint Bottom -->
  <text x="300" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Equation: 300 - 150 = ?</text>
</svg>
