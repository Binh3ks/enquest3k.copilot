<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <rect width="600" height="220" fill="#f8fafc" rx="12"/>
  <text x="300" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Part-Whole Bar Model: Artifact Distribution</text>

  <!-- Total Bracket Top -->
  <path d="M 50 65 L 50 55 L 550 55 L 550 65 M 300 55 L 300 45" stroke="#2563eb" stroke-width="3" fill="none"/>
  <text x="300" y="40" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Total Artifacts = 120</text>

  <!-- Part 1: Museum (45) -->
  <rect x="50" y="70" width="187" height="60" fill="#3b82f6" rx="6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="143" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Museum</text>
  <text x="143" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">45 artifacts</text>

  <!-- Part 2: Friends (30) -->
  <rect x="239" y="70" width="125" height="60" fill="#ec4899" rx="6" stroke="#be185d" stroke-width="2"/>
  <text x="301" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Friends</text>
  <text x="301" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">30 artifacts</text>

  <!-- Part 3: Kept (? = 45) -->
  <rect x="366" y="70" width="184" height="60" fill="#10b981" rx="6" stroke="#047857" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="458" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Kept</text>
  <text x="458" y="120" font-family="sans-serif" font-size="16" font-weight="extrabold" fill="#ffffff" text-anchor="middle">?</text>

  <!-- Equation Hint Bottom -->
  <text x="300" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Equation: 120 - 45 - 30 = ?</text>
</svg>
