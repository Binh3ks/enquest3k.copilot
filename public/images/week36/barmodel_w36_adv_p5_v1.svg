<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <rect width="600" height="220" fill="#f8fafc" rx="12"/>
  <text x="300" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Equal Groups Bar Model: Explorers on 5 Boats</text>

  <!-- Total Bracket Top -->
  <path d="M 50 65 L 50 55 L 550 55 L 550 65 M 300 55 L 300 45" stroke="#2563eb" stroke-width="3" fill="none"/>
  <text x="300" y="40" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Total Explorers = ?</text>

  <!-- 5 Equal Groups -->
  <g>
    <!-- Group 1 -->
    <rect x="50" y="70" width="96" height="60" fill="#6366f1" rx="6" stroke="#4f46e5" stroke-width="2"/>
    <text x="98" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Boat 1</text>
    <text x="98" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>

    <!-- Group 2 -->
    <rect x="151" y="70" width="96" height="60" fill="#6366f1" rx="6" stroke="#4f46e5" stroke-width="2"/>
    <text x="199" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Boat 2</text>
    <text x="199" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>

    <!-- Group 3 -->
    <rect x="252" y="70" width="96" height="60" fill="#6366f1" rx="6" stroke="#4f46e5" stroke-width="2"/>
    <text x="300" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Boat 3</text>
    <text x="300" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>

    <!-- Group 4 -->
    <rect x="353" y="70" width="96" height="60" fill="#6366f1" rx="6" stroke="#4f46e5" stroke-width="2"/>
    <text x="401" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Boat 4</text>
    <text x="401" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>

    <!-- Group 5 -->
    <rect x="454" y="70" width="96" height="60" fill="#6366f1" rx="6" stroke="#4f46e5" stroke-width="2"/>
    <text x="502" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Boat 5</text>
    <text x="502" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  </g>

  <!-- Equation Hint Bottom -->
  <text x="300" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Equation: 5 x 8 = ?</text>
</svg>
