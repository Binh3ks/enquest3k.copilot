<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#eab308" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="360" rx="24" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="200" cy="180" r="90" fill="#eab308" fill-opacity="0.12" filter="url(#shadow)"/>
  <text x="200" y="205" font-size="80" text-anchor="middle" dominant-baseline="central">🥢</text>
  <text x="200" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#eab308" text-anchor="middle" letter-spacing="1.5">BATON</text>
</svg>