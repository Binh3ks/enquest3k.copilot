<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Title / Badge -->
  <rect x="20" y="15" width="160" height="24" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" />
  <text x="100" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">EQUAL PARTS MODEL</text>

  <!-- Total Bracket Top -->
  <path d="M 50 70 L 50 55 L 250 55 L 250 45 L 250 55 L 450 55 L 450 70" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">Total Honey Drops: ?</text>

  <!-- Bar 1: Friend 1 (4 drops) -->
  <g filter="url(#shadow)">
    <rect x="50" y="75" width="125" height="55" rx="8" fill="url(#amberGrad)" stroke="#92400e" stroke-width="2" />
    <text x="112" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Friend 1</text>
    <text x="112" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fef3c7" text-anchor="middle">4 drops</text>
  </g>

  <!-- Bar 2: Friend 2 (4 drops) -->
  <g filter="url(#shadow)">
    <rect x="185" y="75" width="125" height="55" rx="8" fill="url(#amberGrad)" stroke="#92400e" stroke-width="2" />
    <text x="247" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Friend 2</text>
    <text x="247" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fef3c7" text-anchor="middle">4 drops</text>
  </g>

  <!-- Bar 3: Friend 3 (4 drops) -->
  <g filter="url(#shadow)">
    <rect x="320" y="75" width="125" height="55" rx="8" fill="url(#amberGrad)" stroke="#92400e" stroke-width="2" />
    <text x="382" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Friend 3</text>
    <text x="382" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fef3c7" text-anchor="middle">4 drops</text>
  </g>

  <!-- Bottom Bracket Hint -->
  <path d="M 50 140 L 50 152 L 250 152 L 250 160 L 250 152 L 450 152 L 450 140" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <text x="250" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">Target: 4 × 3 = 12 drops</text>
</svg>
