<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Title / Badge -->
  <rect x="20" y="15" width="160" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="100" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#3730a3" text-anchor="middle">PART-WHOLE MODEL</text>

  <!-- Total Bracket Top -->
  <path d="M 50 70 L 50 55 L 250 55 L 250 45 L 250 55 L 450 55 L 450 70" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">Total Sleep: ? hours</text>

  <!-- Bar 1: Day (14h) -->
  <g filter="url(#shadow)">
    <rect x="50" y="75" width="310" height="55" rx="8" fill="url(#indigoGrad)" stroke="#312e81" stroke-width="2" />
    <text x="205" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Day Sleep</text>
    <text x="205" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e0e7ff" text-anchor="middle">14 hours</text>
  </g>

  <!-- Bar 2: Night (4h) -->
  <g filter="url(#shadow)">
    <rect x="360" y="75" width="90" height="55" rx="8" fill="url(#cyanGrad)" stroke="#155e75" stroke-width="2" />
    <text x="405" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Night</text>
    <text x="405" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#cffafe" text-anchor="middle">4 hours</text>
  </g>

  <!-- Bottom Bracket Hint -->
  <path d="M 50 140 L 50 152 L 250 152 L 250 160 L 250 152 L 450 152 L 450 140" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
  <text x="250" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#3730a3" text-anchor="middle">Target: 14 + 4 = 18 hours</text>
</svg>
