<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Title / Badge -->
  <rect x="20" y="15" width="160" height="24" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
  <text x="100" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">PART-WHOLE MODEL</text>

  <!-- Total Bracket Top -->
  <path d="M 50 70 L 50 55 L 250 55 L 250 45 L 250 55 L 450 55 L 450 70" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">Total Rope: 60 meters</text>

  <!-- Bar 1: Used (25m) -->
  <g filter="url(#shadow)">
    <rect x="50" y="75" width="160" height="55" rx="8" fill="url(#redGrad)" stroke="#991b1b" stroke-width="2" />
    <text x="130" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Used for Net</text>
    <text x="130" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fee2e2" text-anchor="middle">25 meters</text>
  </g>

  <!-- Bar 2: Left (? m) -->
  <g filter="url(#shadow)">
    <rect x="210" y="75" width="240" height="55" rx="8" fill="url(#greenGrad)" stroke="#166534" stroke-width="2" />
    <text x="330" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Remaining Rope</text>
    <text x="330" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#dcfce7" text-anchor="middle">? meters</text>
  </g>

  <!-- Bottom Bracket Hint -->
  <path d="M 210 140 L 210 152 L 330 152 L 330 160 L 330 152 L 450 152 L 450 140" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  <text x="330" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">Target: 60 - 25 = 35 meters</text>
</svg>
