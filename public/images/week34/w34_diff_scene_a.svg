<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- W34 S1 — Find Differences — SCENE A (Reference Scene) -->
  <!-- Pedagogy: Scene A has blue butterfly on rock, grey mouse, pink flower, clear sun -->

  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="sky_a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F4FF"/>
    </linearGradient>
    <linearGradient id="ground_a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="40%" stop-color="#558B2F"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
    <linearGradient id="tree_a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="900" height="400" fill="url(#sky_a)"/>
  <!-- Ground -->
  <rect x="0" y="370" width="900" height="230" fill="url(#ground_a)"/>
  <!-- Ground edge -->
  <ellipse cx="450" cy="370" rx="450" ry="18" fill="#8BC34A"/>

  <!-- ══ SUN (Scene A — CLEAR, no cloud) ══ -->
  <circle cx="820" cy="75" r="48" fill="#FFD54F" opacity="0.95"/>
  <circle cx="820" cy="75" r="38" fill="#FFCA28"/>
  <!-- Sun rays -->
  <g stroke="#FFB300" stroke-width="3" stroke-linecap="round">
    <line x1="820" y1="15" x2="820" y2="5"/>
    <line x1="820" y1="135" x2="820" y2="145"/>
    <line x1="760" y1="75" x2="750" y2="75"/>
    <line x1="880" y1="75" x2="890" y2="75"/>
    <line x1="778" y1="33" x2="771" y2="26"/>
    <line x1="862" y1="117" x2="869" y2="124"/>
    <line x1="862" y1="33" x2="869" y2="26"/>
    <line x1="778" y1="117" x2="771" y2="124"/>
  </g>
  <!-- Sun face (happy) -->
  <circle cx="812" cy="70" r="3" fill="#E65100"/>
  <circle cx="828" cy="70" r="3" fill="#E65100"/>
  <path d="M808 82 Q820 90 832 82" stroke="#E65100" stroke-width="2" fill="none"/>

  <!-- ══ CLOUDS (white fluffy) ══ -->
  <g fill="white" opacity="0.9">
    <ellipse cx="160" cy="65" rx="60" ry="28"/>
    <ellipse cx="200" cy="55" rx="45" ry="24"/>
    <ellipse cx="120" cy="62" rx="40" ry="22"/>
    <ellipse cx="500" cy="90" rx="50" ry="22"/>
    <ellipse cx="545" cy="80" rx="38" ry="20"/>
    <ellipse cx="462" cy="88" rx="35" ry="18"/>
  </g>

  <!-- ══ LARGE OAK TREE (left center) ══ -->
  <!-- Trunk -->
  <rect x="295" y="230" width="65" height="160" rx="10" fill="#795548"/>
  <!-- Bark texture -->
  <path d="M308 250 Q313 270 308 290 Q313 310 308 340" stroke="#5D4037" stroke-width="2" fill="none"/>
  <path d="M345 245 Q340 265 345 285 Q340 305 345 335" stroke="#5D4037" stroke-width="2" fill="none"/>
  <!-- Roots -->
  <path d="M295 385 Q272 392 252 400" stroke="#795548" stroke-width="4" fill="none"/>
  <path d="M360 385 Q382 392 402 400" stroke="#795548" stroke-width="4" fill="none"/>
  <!-- Canopy layers -->
  <ellipse cx="327" cy="165" rx="138" ry="95" fill="#388E3C"/>
  <ellipse cx="240" cy="135" rx="72" ry="60" fill="#43A047"/>
  <ellipse cx="415" cy="130" rx="65" ry="58" fill="#43A047"/>
  <ellipse cx="327" cy="88" rx="75" ry="52" fill="#4CAF50"/>
  <ellipse cx="275" cy="175" rx="60" ry="44" fill="#388E3C"/>
  <ellipse cx="382" cy="178" rx="57" ry="42" fill="#388E3C"/>
  <!-- Highlight on canopy -->
  <ellipse cx="310" cy="100" rx="35" ry="22" fill="#66BB6A" opacity="0.5"/>

  <!-- Branch extending right (for Hunter's Hat) -->
  <path d="M360 230 Q430 185 490 175" stroke="#795548" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Hunter's Hat on branch (inst_5 — dark green) -->
  <g transform="translate(468,153)">
    <ellipse cx="0" cy="15" rx="42" ry="11" fill="#2E7D32"/>
    <path d="M-25 15 L-20 -22 Q-10 -36 0 -37 Q10 -36 20 -22 L25 15" fill="#388E3C"/>
    <line x1="-22" y1="6" x2="22" y2="6" stroke="#1B5E20" stroke-width="2"/>
    <!-- Hat band detail -->
    <rect x="-22" y="2" width="44" height="5" fill="#1B5E20" opacity="0.6"/>
    <!-- Feather decoration -->
    <path d="M18 -20 Q28 -30 24 -10" stroke="#F9A825" stroke-width="2" fill="none"/>
  </g>

  <!-- ══ LION (sleeping under tree) — mane golden yellow ══ -->
  <g transform="translate(175,318)">
    <!-- Body -->
    <ellipse cx="95" cy="35" rx="115" ry="48" fill="#FFA726"/>
    <!-- Belly lighter area -->
    <ellipse cx="85" cy="40" rx="70" ry="30" fill="#FFB74D" opacity="0.6"/>
    <!-- Mane (golden yellow circle) -->
    <circle cx="198" cy="8" r="58" fill="#F57F17"/>
    <circle cx="198" cy="8" r="50" fill="#FFA000"/>
    <!-- Mane wavy detail -->
    <path d="M142 -38 Q152 -58 163 -42 Q173 -62 183 -44 Q193 -60 203 -44 Q213 -58 222 -40" stroke="#E65100" stroke-width="2" fill="none"/>
    <path d="M140 52 Q150 68 162 55 Q173 70 184 55 Q195 68 208 52" stroke="#E65100" stroke-width="2" fill="none"/>
    <!-- Head -->
    <circle cx="198" cy="8" r="42" fill="#FFA726"/>
    <!-- Face features -->
    <path d="M183 2 Q190 -4 197 2" stroke="#5D4037" stroke-width="2.5" fill="none"/>
    <path d="M199 2 Q206 -4 213 2" stroke="#5D4037" stroke-width="2.5" fill="none"/>
    <ellipse cx="198" cy="16" rx="6" ry="4" fill="#E65100"/>
    <!-- Whiskers -->
    <line x1="155" y1="12" x2="187" y2="15" stroke="#795548" stroke-width="1.5"/>
    <line x1="155" y1="18" x2="187" y2="18" stroke="#795548" stroke-width="1.5"/>
    <line x1="209" y1="15" x2="241" y2="12" stroke="#795548" stroke-width="1.5"/>
    <line x1="209" y1="18" x2="241" y2="18" stroke="#795548" stroke-width="1.5"/>
    <!-- Ears -->
    <path d="M175 -36 Q163 -54 178 -44" stroke="#E65100" stroke-width="2.5" fill="none"/>
    <path d="M220 -36 Q232 -54 218 -44" stroke="#E65100" stroke-width="2.5" fill="none"/>
    <!-- Paws -->
    <ellipse cx="-18" cy="68" rx="32" ry="15" fill="#FFB74D"/>
    <ellipse cx="35" cy="74" rx="30" ry="14" fill="#FFB74D"/>
    <!-- Toe lines -->
    <line x1="-30" y1="67" x2="-33" y2="80" stroke="#5D4037" stroke-width="1.5"/>
    <line x1="-18" y1="82" x2="-18" y2="83" stroke="#5D4037" stroke-width="1.5"/>
    <line x1="-6" y1="67" x2="-3" y2="80" stroke="#5D4037" stroke-width="1.5"/>
    <!-- Tail -->
    <path d="M-22 20 Q-62 5 -72 -12 Q-78 -22 -65 -28" stroke="#FFA726" stroke-width="6" fill="none"/>
    <ellipse cx="-65" cy="-30" rx="13" ry="10" fill="#F57F17"/>
  </g>

  <!-- ══ MOSSY ROCK with MOUSE (grey in Scene A) ══ -->
  <g transform="translate(62,348)">
    <!-- Rock -->
    <ellipse cx="60" cy="40" rx="70" ry="38" fill="#9E9E9E"/>
    <ellipse cx="60" cy="38" rx="60" ry="30" fill="#BDBDBD"/>
    <!-- Rock highlights -->
    <ellipse cx="45" cy="28" rx="20" ry="10" fill="#E0E0E0" opacity="0.5"/>
    <!-- Moss patches -->
    <ellipse cx="35" cy="20" rx="18" ry="8" fill="#558B2F" opacity="0.7"/>
    <ellipse cx="70" cy="15" rx="15" ry="7" fill="#558B2F" opacity="0.7"/>
    <ellipse cx="95" cy="22" rx="12" ry="6" fill="#558B2F" opacity="0.6"/>
    <!-- Moss detail (tufts) -->
    <path d="M25 19 Q32 9 40 19" stroke="#2E7D32" stroke-width="1.5" fill="none"/>
    <path d="M60 12 Q67 2 75 12" stroke="#2E7D32" stroke-width="1.5" fill="none"/>
    <path d="M87 19 Q94 10 100 19" stroke="#2E7D32" stroke-width="1.5" fill="none"/>

    <!-- MOUSE — GREY (Scene A) -->
    <g transform="translate(30,-22)">
      <!-- Body -->
      <ellipse cx="20" cy="15" rx="22" ry="14" fill="#9E9E9E"/>
      <!-- Head -->
      <circle cx="40" cy="6" r="15" fill="#9E9E9E"/>
      <!-- Ear -->
      <circle cx="34" cy="-7" r="8" fill="#BDBDBD"/>
      <circle cx="34" cy="-7" r="5" fill="#F48FB1" opacity="0.7"/>
      <!-- Eye -->
      <circle cx="46" cy="3" r="3" fill="#212121"/>
      <circle cx="47" cy="2" r="1" fill="white"/>
      <!-- Nose -->
      <circle cx="54" cy="7" r="2.5" fill="#F48FB1"/>
      <!-- Whiskers -->
      <line x1="55" y1="5" x2="68" y2="1" stroke="#616161" stroke-width="1.2"/>
      <line x1="55" y1="7" x2="70" y2="7" stroke="#616161" stroke-width="1.2"/>
      <line x1="55" y1="9" x2="68" y2="12" stroke="#616161" stroke-width="1.2"/>
      <!-- Tail -->
      <path d="M-2 20 Q-22 24 -28 36" stroke="#757575" stroke-width="2.5" fill="none"/>
      <!-- Feet -->
      <ellipse cx="33" cy="27" rx="9" ry="5" fill="#BDBDBD"/>
      <ellipse cx="13" cy="27" rx="9" ry="5" fill="#BDBDBD"/>
    </g>
  </g>

  <!-- ══ BLUE BUTTERFLY on rock (Scene A ONLY — difference d3) ══ -->
  <g transform="translate(95,345)">
    <!-- Left wings -->
    <ellipse cx="-12" cy="-8" rx="16" ry="11" fill="#1565C0" opacity="0.85" transform="rotate(-30 -12 -8)"/>
    <ellipse cx="-10" cy="6" rx="12" ry="8" fill="#1976D2" opacity="0.8" transform="rotate(20 -10 6)"/>
    <!-- Right wings -->
    <ellipse cx="12" cy="-8" rx="16" ry="11" fill="#1565C0" opacity="0.85" transform="rotate(30 12 -8)"/>
    <ellipse cx="10" cy="6" rx="12" ry="8" fill="#1976D2" opacity="0.8" transform="rotate(-20 10 6)"/>
    <!-- Wing patterns -->
    <circle cx="-10" cy="-8" r="4" fill="#BBDEFB" opacity="0.6"/>
    <circle cx="10" cy="-8" r="4" fill="#BBDEFB" opacity="0.6"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="2.5" ry="9" fill="#212121"/>
    <!-- Antennae -->
    <path d="M0 -9 Q-6 -18 -8 -22" stroke="#333" stroke-width="1.2" fill="none"/>
    <path d="M0 -9 Q6 -18 8 -22" stroke="#333" stroke-width="1.2" fill="none"/>
    <circle cx="-8" cy="-22" r="2" fill="#1565C0"/>
    <circle cx="8" cy="-22" r="2" fill="#1565C0"/>
  </g>

  <!-- ══ PINK FLOWER (right center — difference d2) ══ -->
  <g transform="translate(620,340)">
    <!-- Stem -->
    <line x1="20" y1="60" x2="20" y2="15" stroke="#388E3C" stroke-width="3"/>
    <!-- Leaves -->
    <ellipse cx="8" cy="40" rx="12" ry="6" fill="#4CAF50" transform="rotate(-30 8 40)"/>
    <ellipse cx="32" cy="45" rx="12" ry="6" fill="#4CAF50" transform="rotate(30 32 45)"/>
    <!-- Petals PINK (Scene A) -->
    <circle cx="20" cy="15" r="12" fill="#E91E63" opacity="0.9"/>
    <ellipse cx="20" cy="0" rx="9" ry="14" fill="#F48FB1"/>
    <ellipse cx="20" cy="30" rx="9" ry="14" fill="#F48FB1"/>
    <ellipse cx="5" cy="15" rx="14" ry="9" fill="#F48FB1"/>
    <ellipse cx="35" cy="15" rx="14" ry="9" fill="#F48FB1"/>
    <!-- Diagonal petals -->
    <ellipse cx="9" cy="4" rx="9" ry="14" fill="#F48FB1" transform="rotate(45 9 4)"/>
    <ellipse cx="31" cy="4" rx="9" ry="14" fill="#F48FB1" transform="rotate(-45 31 4)"/>
    <ellipse cx="9" cy="26" rx="9" ry="14" fill="#F48FB1" transform="rotate(-45 9 26)"/>
    <ellipse cx="31" cy="26" rx="9" ry="14" fill="#F48FB1" transform="rotate(45 31 26)"/>
    <!-- Center -->
    <circle cx="20" cy="15" r="9" fill="#FDD835"/>
    <circle cx="20" cy="15" r="5" fill="#F9A825"/>
    <!-- Pollen dots -->
    <circle cx="16" cy="12" r="1.5" fill="#E65100"/>
    <circle cx="23" cy="11" r="1.5" fill="#E65100"/>
    <circle cx="19" cy="19" r="1.5" fill="#E65100"/>
  </g>

  <!-- ══ STREAM (bottom right) ══ -->
  <path d="M650 570 Q690 548 740 553 Q790 558 840 542 Q870 534 900 538"
    stroke="#29B6F6" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M655 574 Q695 554 745 558 Q795 564 845 548" stroke="white" stroke-width="3" fill="none" opacity="0.5"/>
  <!-- Water ripples -->
  <path d="M710 556 Q720 550 730 556" stroke="#0288D1" stroke-width="2" fill="none"/>
  <path d="M770 548 Q780 543 790 548" stroke="#0288D1" stroke-width="2" fill="none"/>

  <!-- ══ ROPE NET near bushes ══ -->
  <g transform="translate(630,272)" opacity="0.85">
    <!-- Bushes -->
    <ellipse cx="80" cy="95" rx="80" ry="48" fill="#388E3C"/>
    <ellipse cx="25" cy="92" rx="52" ry="42" fill="#43A047"/>
    <ellipse cx="140" cy="95" rx="52" ry="40" fill="#43A047"/>
    <!-- Net grid -->
    <g stroke="#8D6E63" stroke-width="1.8">
      <line x1="28" y1="10" x2="23" y2="72"/>
      <line x1="52" y1="8" x2="47" y2="70"/>
      <line x1="76" y1="6" x2="71" y2="70"/>
      <line x1="100" y1="8" x2="95" y2="70"/>
      <line x1="124" y1="10" x2="119" y2="72"/>
      <path d="M22 22 Q74 20 124 22" fill="none"/>
      <path d="M22 36 Q74 34 124 36" fill="none"/>
      <path d="M21 50 Q74 48 123 50" fill="none"/>
      <path d="M21 64 Q74 62 122 64" fill="none"/>
      <line x1="10" y1="8" x2="138" y2="6" stroke-width="2.5"/>
    </g>
  </g>

  <!-- ══ TITLE LABEL ══ -->
  <rect x="280" y="8" width="340" height="34" rx="8" fill="#1565C0" opacity="0.9"/>
  <text x="450" y="24" text-anchor="middle" font-size="12" fill="white" font-weight="900" font-family="sans-serif">W34 — S1 FIND DIFFERENCES</text>
  <text x="450" y="36" text-anchor="middle" font-size="11" fill="#BBDEFB" font-weight="700" font-family="sans-serif">🖼️ PICTURE A — Forest Afternoon</text>

  <!-- ══ SCENE A Indicator Badge ══ -->
  <rect x="15" y="15" width="80" height="30" rx="8" fill="#1565C0"/>
  <text x="55" y="35" text-anchor="middle" font-size="16" fill="white" font-weight="900" font-family="sans-serif">A</text>
</svg>
