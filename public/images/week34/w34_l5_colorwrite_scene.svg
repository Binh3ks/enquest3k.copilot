<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" style="background:#fff;font-family:sans-serif">
  <!-- Cambridge A2 Flyers — W34 L5 Color & Write — Line-Art Scene -->
  <!-- Scene: Forest clearing with lion resting under oak tree, mouse on mossy rock, rope net near bushes -->

  <!-- ══ SKY & BACKGROUND ══ -->
  <rect x="0" y="0" width="900" height="380" fill="none" stroke="none"/>

  <!-- Sun top-right -->
  <circle cx="820" cy="70" r="45" fill="none" stroke="#333" stroke-width="2.5"/>
  <line x1="820" y1="10" x2="820" y2="2" stroke="#333" stroke-width="2"/>
  <line x1="820" y1="128" x2="820" y2="138" stroke="#333" stroke-width="2"/>
  <line x1="760" y1="70" x2="750" y2="70" stroke="#333" stroke-width="2"/>
  <line x1="880" y1="70" x2="890" y2="70" stroke="#333" stroke-width="2"/>
  <line x1="778" y1="28" x2="771" y2="21" stroke="#333" stroke-width="2"/>
  <line x1="863" y1="113" x2="870" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="863" y1="28" x2="870" y2="21" stroke="#333" stroke-width="2"/>
  <line x1="778" y1="113" x2="771" y2="120" stroke="#333" stroke-width="2"/>

  <!-- Clouds -->
  <ellipse cx="150" cy="60" rx="55" ry="28" fill="none" stroke="#333" stroke-width="2"/>
  <ellipse cx="190" cy="50" rx="40" ry="22" fill="none" stroke="#333" stroke-width="2"/>
  <ellipse cx="115" cy="55" rx="35" ry="20" fill="none" stroke="#333" stroke-width="2"/>

  <ellipse cx="580" cy="80" rx="45" ry="22" fill="none" stroke="#333" stroke-width="2"/>
  <ellipse cx="615" cy="70" rx="32" ry="18" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Ground horizon line -->
  <line x1="0" y1="370" x2="900" y2="370" stroke="#555" stroke-width="2"/>

  <!-- Grass tufts -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <polyline points="30,370 35,355 40,370"/>
    <polyline points="50,370 55,352 60,370"/>
    <polyline points="80,370 84,358 88,370"/>
    <polyline points="700,370 705,355 710,370"/>
    <polyline points="730,370 735,358 740,370"/>
    <polyline points="760,370 765,352 770,370"/>
    <polyline points="830,370 835,360 840,370"/>
    <polyline points="860,370 865,355 870,370"/>
  </g>
  <!-- Ground fill -->
  <rect x="0" y="370" width="900" height="230" fill="none" stroke="none"/>
  <!-- Ground line art hatching -->
  <path d="M0 380 Q200 375 400 382 Q600 388 900 380" stroke="#888" stroke-width="1" fill="none"/>
  <path d="M0 400 Q150 395 350 402 Q550 408 900 400" stroke="#bbb" stroke-width="0.8" fill="none"/>

  <!-- ══ LARGE OAK TREE (center-left) ══ -->
  <!-- Trunk -->
  <rect x="295" y="220" width="60" height="180" rx="8" fill="none" stroke="#333" stroke-width="3"/>
  <!-- Trunk bark lines -->
  <path d="M305 240 Q310 260 305 280 Q310 300 305 320" stroke="#555" stroke-width="1.2" fill="none"/>
  <path d="M340 235 Q335 255 340 275 Q335 295 340 320" stroke="#555" stroke-width="1.2" fill="none"/>
  <!-- Roots -->
  <path d="M295 390 Q275 395 255 400" stroke="#333" stroke-width="2.5" fill="none"/>
  <path d="M355 390 Q375 395 395 402" stroke="#333" stroke-width="2.5" fill="none"/>
  <!-- Main canopy -->
  <ellipse cx="325" cy="160" rx="130" ry="90" fill="none" stroke="#333" stroke-width="3"/>
  <!-- Canopy detail clusters -->
  <ellipse cx="230" cy="130" rx="65" ry="55" fill="none" stroke="#333" stroke-width="2.5"/>
  <ellipse cx="420" cy="125" rx="60" ry="52" fill="none" stroke="#333" stroke-width="2.5"/>
  <ellipse cx="325" cy="85" rx="70" ry="48" fill="none" stroke="#333" stroke-width="2.5"/>
  <ellipse cx="270" cy="170" rx="55" ry="40" fill="none" stroke="#444" stroke-width="2"/>
  <ellipse cx="380" cy="175" rx="52" ry="38" fill="none" stroke="#444" stroke-width="2"/>
  <!-- Leaf detail lines -->
  <path d="M280 100 Q290 90 300 100 Q290 110 280 100Z" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M340 78 Q350 68 360 78 Q350 88 340 78Z" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M390 105 Q400 95 410 105 Q400 115 390 105Z" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M220 140 Q228 132 236 140 Q228 148 220 140Z" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M410 140 Q418 132 426 140 Q418 148 410 140Z" stroke="#333" stroke-width="1" fill="none"/>

  <!-- Branch with Hunter's Hat label area -->
  <path d="M355 220 Q420 180 470 170" stroke="#333" stroke-width="3" fill="none"/>
  <!-- Hunter's Hat on branch (inst_5) — coloring target -->
  <g transform="translate(450,148)">
    <!-- Hat brim -->
    <ellipse cx="0" cy="12" rx="38" ry="9" fill="none" stroke="#333" stroke-width="2.5"/>
    <!-- Hat crown -->
    <path d="M-22 12 L-18 -18 Q-10 -32 0 -33 Q10 -32 18 -18 L22 12" fill="none" stroke="#333" stroke-width="2.5"/>
    <!-- Hat band -->
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#333" stroke-width="1.5"/>
    <!-- Label -->
    <rect x="-30" y="-52" width="60" height="15" rx="4" fill="white" stroke="#aaa" stroke-width="1"/>
    <text x="0" y="-42" text-anchor="middle" font-size="9" fill="#444" font-weight="600">Hunter's Hat</text>
  </g>

  <!-- ══ LION RESTING (center, under tree) — inst_1 target ══ -->
  <g transform="translate(285,330)">
    <!-- Body (sleeping, elongated) -->
    <ellipse cx="60" cy="30" rx="110" ry="45" fill="none" stroke="#333" stroke-width="3"/>
    <!-- Head -->
    <circle cx="155" cy="10" r="42" fill="none" stroke="#333" stroke-width="3"/>
    <!-- Mane (fluffy circle around head) — MAIN COLOR TARGET -->
    <ellipse cx="155" cy="10" rx="58" ry="56" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="8 4"/>
    <!-- Mane wavy detail -->
    <path d="M98 -30 Q108 -50 120 -35 Q130 -55 142 -38 Q152 -58 162 -40 Q174 -56 183 -38 Q193 -52 203 -35 Q213 -48 218 -30" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M95 48 Q105 62 118 52 Q128 66 140 54 Q152 68 163 54 Q175 66 186 52 Q198 60 207 46" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Eyes (closed, sleeping) -->
    <path d="M140 5 Q147 0 154 5" stroke="#333" stroke-width="2" fill="none"/>
    <path d="M160 5 Q167 0 174 5" stroke="#333" stroke-width="2" fill="none"/>
    <!-- Nose -->
    <path d="M152 16 Q157 22 162 16" stroke="#333" stroke-width="2" fill="none"/>
    <ellipse cx="157" cy="17" rx="5" ry="3" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- Whiskers -->
    <line x1="113" y1="12" x2="145" y2="15" stroke="#333" stroke-width="1.5"/>
    <line x1="113" y1="18" x2="145" y2="18" stroke="#333" stroke-width="1.5"/>
    <line x1="113" y1="24" x2="145" y2="22" stroke="#333" stroke-width="1.5"/>
    <line x1="170" y1="15" x2="203" y2="12" stroke="#333" stroke-width="1.5"/>
    <line x1="170" y1="18" x2="203" y2="18" stroke="#333" stroke-width="1.5"/>
    <line x1="170" y1="22" x2="203" y2="24" stroke="#333" stroke-width="1.5"/>
    <!-- Ear -->
    <path d="M135 -28 Q125 -45 140 -38" stroke="#333" stroke-width="2" fill="none"/>
    <path d="M175 -28 Q185 -45 170 -38" stroke="#333" stroke-width="2" fill="none"/>
    <!-- Front paws -->
    <ellipse cx="-30" cy="60" rx="30" ry="14" fill="none" stroke="#333" stroke-width="2.5"/>
    <ellipse cx="20" cy="66" rx="28" ry="13" fill="none" stroke="#333" stroke-width="2.5"/>
    <!-- Paw toes -->
    <line x1="-45" y1="60" x2="-47" y2="72" stroke="#333" stroke-width="1.5"/>
    <line x1="-30" y1="73" x2="-30" y2="74" stroke="#333" stroke-width="1.5"/>
    <line x1="-15" y1="60" x2="-13" y2="72" stroke="#333" stroke-width="1.5"/>
    <!-- Tail -->
    <path d="M-45 15 Q-85 0 -95 -15 Q-100 -25 -88 -30" stroke="#333" stroke-width="2.5" fill="none"/>
    <!-- Tail tuft -->
    <ellipse cx="-88" cy="-32" rx="12" ry="9" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Label -->
    <rect x="30" y="-78" width="100" height="16" rx="4" fill="white" stroke="#aaa" stroke-width="1"/>
    <text x="80" y="-66" text-anchor="middle" font-size="10" fill="#444" font-weight="700">🦁 Leo the Lion</text>
    <text x="80" y="-76" text-anchor="middle" font-size="8" fill="#f59e0b" font-weight="700">← Color mane golden yellow</text>
  </g>

  <!-- ══ MOSSY ROCK (left) ══ -->
  <g transform="translate(60,340)">
    <ellipse cx="55" cy="35" rx="65" ry="35" fill="none" stroke="#333" stroke-width="2.5"/>
    <!-- Rock texture cracks -->
    <path d="M30 20 Q40 30 35 45" stroke="#555" stroke-width="1.2" fill="none"/>
    <path d="M65 15 Q75 28 70 42" stroke="#555" stroke-width="1.2" fill="none"/>
    <!-- Moss tufts on top -->
    <path d="M25 18 Q32 8 40 18" stroke="#333" stroke-width="1.5" fill="none"/>
    <path d="M55 12 Q62 2 70 12" stroke="#333" stroke-width="1.5" fill="none"/>
    <path d="M80 18 Q87 9 94 18" stroke="#333" stroke-width="1.5" fill="none"/>

    <!-- ══ MOUSE on rock — inst_3 target ══ -->
    <g transform="translate(38,-8)">
      <!-- Mouse body -->
      <ellipse cx="18" cy="12" rx="20" ry="13" fill="none" stroke="#333" stroke-width="2.5"/>
      <!-- Mouse head -->
      <circle cx="36" cy="4" r="14" fill="none" stroke="#333" stroke-width="2.5"/>
      <!-- Ear -->
      <circle cx="30" cy="-9" r="7" fill="none" stroke="#333" stroke-width="2"/>
      <circle cx="30" cy="-9" r="4" fill="none" stroke="#555" stroke-width="1.2"/>
      <!-- Eye -->
      <circle cx="41" cy="1" r="2.5" fill="none" stroke="#333" stroke-width="1.5"/>
      <circle cx="41.8" cy="0.5" r="1" fill="#333"/>
      <!-- Nose -->
      <circle cx="49" cy="5" r="2" fill="none" stroke="#333" stroke-width="1.5"/>
      <!-- Whiskers -->
      <line x1="50" y1="3" x2="62" y2="-1" stroke="#333" stroke-width="1.2"/>
      <line x1="50" y1="5" x2="64" y2="5" stroke="#333" stroke-width="1.2"/>
      <line x1="50" y1="7" x2="62" y2="10" stroke="#333" stroke-width="1.2"/>
      <!-- Tail -->
      <path d="M-2 18 Q-20 22 -25 35" stroke="#333" stroke-width="2" fill="none"/>
      <!-- Front feet -->
      <ellipse cx="30" cy="24" rx="8" ry="4" fill="none" stroke="#333" stroke-width="1.5"/>
      <ellipse cx="12" cy="24" rx="8" ry="4" fill="none" stroke="#333" stroke-width="1.5"/>
      <!-- Label -->
      <rect x="-10" y="-40" width="80" height="15" rx="4" fill="white" stroke="#aaa" stroke-width="1"/>
      <text x="30" y="-29" text-anchor="middle" font-size="9" fill="#444" font-weight="700">🐭 Milo the Mouse</text>
      <text x="30" y="-40" text-anchor="middle" font-size="8" fill="#a16207" font-weight="700">← Color brown</text>
    </g>
  </g>

  <!-- ══ ROPE NET near bushes (right side) — inst_2 WRITE "NET" ══ -->
  <g transform="translate(620,260)">
    <!-- Bushes -->
    <ellipse cx="80" cy="100" rx="80" ry="50" fill="none" stroke="#333" stroke-width="2.5"/>
    <ellipse cx="20" cy="95" rx="55" ry="45" fill="none" stroke="#333" stroke-width="2.5"/>
    <ellipse cx="145" cy="100" rx="55" ry="42" fill="none" stroke="#333" stroke-width="2.5"/>
    <!-- Bush leaf detail -->
    <path d="M50 65 Q55 55 62 65" stroke="#333" stroke-width="1.5" fill="none"/>
    <path d="M80 55 Q87 45 94 55" stroke="#333" stroke-width="1.5" fill="none"/>
    <path d="M108 65 Q115 55 122 65" stroke="#333" stroke-width="1.5" fill="none"/>
    <!-- Rope net grid (strung between trees) -->
    <g stroke="#333" stroke-width="1.8" fill="none" opacity="0.9">
      <!-- Vertical ropes -->
      <line x1="30" y1="10" x2="25" y2="80"/>
      <line x1="55" y1="8" x2="50" y2="78"/>
      <line x1="80" y1="6" x2="75" y2="77"/>
      <line x1="105" y1="8" x2="100" y2="78"/>
      <line x1="130" y1="10" x2="125" y2="80"/>
      <!-- Horizontal ropes -->
      <path d="M25 20 Q78 18 130 20"/>
      <path d="M25 35 Q78 32 130 35"/>
      <path d="M24 50 Q78 47 129 50"/>
      <path d="M24 65 Q78 62 128 65"/>
      <path d="M23 78 Q78 75 127 78"/>
      <!-- Top rope anchor line -->
      <line x1="10" y1="8" x2="145" y2="6" stroke="#333" stroke-width="2.5"/>
    </g>
    <!-- "NET" write label area (inst_2) -->
    <rect x="38" y="-25" width="85" height="22" rx="5" fill="white" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="80" y="-9" text-anchor="middle" font-size="11" fill="#b45309" font-weight="900">Write: "NET" here</text>
  </g>

  <!-- ══ FOREST SIGNBOARD (right path) — inst_4 WRITE "FOREST" ══ -->
  <g transform="translate(760,300)">
    <!-- Post -->
    <rect x="44" y="40" width="12" height="80" rx="3" fill="none" stroke="#333" stroke-width="2.5"/>
    <!-- Sign board -->
    <rect x="5" y="5" width="90" height="42" rx="5" fill="none" stroke="#333" stroke-width="2.5"/>
    <!-- Write area dashes -->
    <rect x="10" y="10" width="80" height="32" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="50" y="32" text-anchor="middle" font-size="10" fill="#b45309" font-weight="900">Write: "FOREST"</text>
    <!-- Ground peg -->
    <path d="M44 120 Q38 130 56 130 Q50 120 44 120Z" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Label -->
    <text x="50" y="-5" text-anchor="middle" font-size="8" fill="#666">Signboard</text>
  </g>

  <!-- ══ STREAM / RIVER (bottom right) ══ -->
  <path d="M680 570 Q720 550 760 555 Q800 560 840 545 Q870 535 900 540" stroke="#333" stroke-width="2.5" fill="none"/>
  <path d="M685 580 Q725 562 765 567 Q805 572 845 558 Q875 548 900 552" stroke="#aaa" stroke-width="1.5" fill="none"/>
  <!-- Water ripples -->
  <path d="M730 560 Q740 555 750 560" stroke="#555" stroke-width="1.2" fill="none"/>
  <path d="M780 552 Q790 547 800 552" stroke="#555" stroke-width="1.2" fill="none"/>

  <!-- ══ TITLE LABEL (top center) ══ -->
  <rect x="310" y="8" width="280" height="28" rx="6" fill="white" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="27" text-anchor="middle" font-size="13" fill="#4338ca" font-weight="900">W34 — L5: Colour and Write!</text>

  <!-- ══ EXAMPLE LABEL (leaves top of tree) ══ -->
  <rect x="190" y="55" width="130" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="255" y="68" text-anchor="middle" font-size="9.5" fill="#92400e" font-weight="700">★ EXAMPLE: Color leaves dark green</text>

</svg>
