<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Title / Badge -->
  <rect x="20" y="15" width="160" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
  <text x="100" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#065f46" text-anchor="middle">PART-WHOLE MODEL</text>

  <!-- Total Bracket Top -->
  <path d="M 50 70 L 50 55 L 250 55 L 250 45 L 250 55 L 450 55 L 450 70" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">Total Ropes: 30</text>

  <!-- Bar 1: Chewed (18) -->
  <g filter="url(#shadow)">
    <rect x="50" y="75" width="240" height="55" rx="8" fill="url(#emeraldGrad)" stroke="#065f46" stroke-width="2" />
    <text x="170" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Chewed Ropes</text>
    <text x="170" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#d1fae5" text-anchor="middle">18 ropes</text>
  </g>

  <!-- Bar 2: Remaining (? ropes) -->
  <g filter="url(#shadow)">
    <rect x="290" y="75" width="160" height="55" rx="8" fill="url(#roseGrad)" stroke="#881337" stroke-width="2" />
    <text x="370" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Remaining</text>
    <text x="370" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffe4e6" text-anchor="middle">? ropes</text>
  </g>

  <!-- Bottom Bracket Hint -->
  <path d="M 290 140 L 290 152 L 370 152 L 370 160 L 370 152 L 450 152 L 450 140" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round"/>
  <text x="370" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#9f1239" text-anchor="middle">Target: 30 - 18 = 12 ropes</text>
</svg>
