<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Title / Badge -->
  <rect x="20" y="15" width="160" height="24" rx="12" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5" />
  <text x="100" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#7e22ce" text-anchor="middle">COMPARISON MODEL</text>

  <!-- Bar 1: Mouse (80m) -->
  <g filter="url(#shadow)">
    <rect x="50" y="55" width="360" height="42" rx="8" fill="url(#purpleGrad)" stroke="#5b21b6" stroke-width="2" />
    <text x="180" y="81" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Mouse (80 meters)</text>
  </g>

  <!-- Bar 2: Rabbit (45m) -->
  <g filter="url(#shadow)">
    <rect x="50" y="105" width="200" height="42" rx="8" fill="url(#amberGrad)" stroke="#b45309" stroke-width="2" />
    <text x="150" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Rabbit (45m)</text>
  </g>

  <!-- Difference Area -->
  <rect x="250" y="105" width="160" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="330" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#b45309" text-anchor="middle">? meters more</text>

  <!-- Difference Bracket -->
  <path d="M 250 155 L 250 165 L 330 165 L 330 172 L 330 165 L 410 165 L 410 155" fill="none" stroke="#7e22ce" stroke-width="2" stroke-linecap="round"/>
  <text x="330" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#6d28d9" text-anchor="middle">Difference: 80 - 45 = 35 meters</text>
</svg>
