<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Glow & Shadow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    
    <!-- Fox Fur Gradients -->
    <linearGradient id="foxFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="foxFurDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    
    <!-- Hat Gradient -->
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    
    <linearGradient id="hatBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    
    <!-- Ear Inner Fluff -->
    <linearGradient id="earInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    
    <!-- Cheek/Muzzle White Fluff -->
    <linearGradient id="muzzleWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#78350f" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Base Badge with Golden Rim -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGlow)" stroke="#f59e0b" stroke-width="4" filter="url(#shadow)"/>

  <!-- Left Fox Ear -->
  <path d="M 26 56 C 20 34 26 12 40 16 C 50 20 54 36 50 56 Z" fill="url(#foxFurDark)"/>
  <!-- Left Ear Inner Fluff -->
  <path d="M 30 50 C 26 36 30 22 38 24 C 44 26 46 38 44 50 Z" fill="url(#earInner)"/>

  <!-- Right Fox Ear -->
  <path d="M 102 56 C 108 34 102 12 88 16 C 78 20 74 36 78 56 Z" fill="url(#foxFurDark)"/>
  <!-- Right Ear Inner Fluff -->
  <path d="M 98 50 C 102 36 98 22 90 24 C 84 26 82 38 84 50 Z" fill="url(#earInner)"/>

  <!-- Fox Main Head Shape -->
  <ellipse cx="64" cy="68" rx="42" ry="36" fill="url(#foxFur)"/>
  
  <!-- Left Cheek Fluff -->
  <path d="M 22 66 C 14 74 18 84 28 86 C 36 88 42 82 42 74 Z" fill="url(#foxFur)"/>
  <!-- Right Cheek Fluff -->
  <path d="M 106 66 C 114 74 110 84 100 86 C 92 88 86 82 86 74 Z" fill="url(#foxFur)"/>

  <!-- White Cheek / Face Mask Bottom -->
  <path d="M 26 72 C 32 86 46 98 64 98 C 82 98 96 86 102 72 C 92 78 80 82 64 82 C 48 82 36 78 26 72 Z" fill="url(#muzzleWhite)"/>
  <path d="M 44 68 C 42 80 52 94 64 94 C 76 94 86 80 84 68 C 76 74 64 76 64 76 C 64 76 52 74 44 68 Z" fill="#ffffff"/>

  <!-- Adventurer Explorer Hat on Top of Head -->
  <path d="M 38 38 C 38 24 90 24 90 38 Z" fill="url(#hatGrad)"/>
  <path d="M 28 38 C 28 35 100 35 100 38 C 100 42 28 42 28 38 Z" fill="#78350f"/>
  <rect x="38" y="33" width="52" height="5" rx="1" fill="url(#hatBand)"/>
  <circle cx="64" cy="35.5" r="2.5" fill="#fbbf24"/>

  <!-- Big Sparkling Friendly Eyes -->
  <!-- Left Eye -->
  <ellipse cx="48" cy="64" rx="6.5" ry="8" fill="#1e293b"/>
  <circle cx="46" cy="61" r="2.5" fill="#ffffff"/>
  <circle cx="50.5" cy="66.5" r="1.2" fill="#ffffff"/>
  <!-- Left Eye Sparkle Reflection -->
  <ellipse cx="48" cy="64" rx="4" ry="5.5" fill="#0f172a" opacity="0.8"/>
  <circle cx="46" cy="61" r="2" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="80" cy="64" rx="6.5" ry="8" fill="#1e293b"/>
  <circle cx="78" cy="61" r="2.5" fill="#ffffff"/>
  <circle cx="82.5" cy="66.5" r="1.2" fill="#ffffff"/>
  <!-- Right Eye Sparkle Reflection -->
  <ellipse cx="80" cy="64" rx="4" ry="5.5" fill="#0f172a" opacity="0.8"/>
  <circle cx="78" cy="61" r="2" fill="#ffffff"/>

  <!-- Cute Rosy Cheeks -->
  <ellipse cx="36" cy="74" rx="5" ry="3" fill="#fb7185" opacity="0.55"/>
  <ellipse cx="92" cy="74" rx="5" ry="3" fill="#fb7185" opacity="0.55"/>

  <!-- Cute Black Fox Nose Button -->
  <path d="M 60 76 C 60 74 68 74 68 76 C 68 79 65 81 64 81 C 63 81 60 79 60 76 Z" fill="#0f172a"/>
  <circle cx="63" cy="75.5" r="0.8" fill="#ffffff"/>

  <!-- Happy Smile Mouth -->
  <path d="M 60 83 Q 64 86 68 83" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  
  <!-- Tiny Tongue Peek -->
  <path d="M 62 84 Q 64 88 66 84 Z" fill="#f43f5e"/>
</svg>
