<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngQuest: Kids Edition</title>
    <script>
      // Vite dynamic import error handler — auto reloads on new deployment chunk hash change
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('[AssetRecovery] Vite preload error caught:', event);
        event.preventDefault();
        window.location.reload();
      });
      window.addEventListener('error', function(e) {
        if (e && e.target && e.target.tagName === 'SCRIPT' && e.target.src && (e.target.src.includes('/assets/') || e.target.src.includes('chunk') || e.target.src.includes('.js'))) {
          console.warn('[AssetRecovery] Stale asset load error caught:', e.target.src);
          var lastReload = parseInt(sessionStorage.getItem('asset_reload_time') || '0', 10);
          if (Date.now() - lastReload > 2000) {
            sessionStorage.setItem('asset_reload_time', String(Date.now()));
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            setTimeout(function() {
              window.location.href = window.location.pathname + '?v=' + Date.now();
            }, 100);
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
