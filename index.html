<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngQuest: Kids Edition</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // When a JS module chunk 404s (stale index.html after new deploy),
      // auto-reload once to pick up the fresh index.html and new asset hashes.
      // sessionStorage guard prevents infinite reload loops.
      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'SCRIPT' && !sessionStorage.getItem('_chunkReload')) {
          sessionStorage.setItem('_chunkReload', '1');
          location.reload(true);
        }
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
