<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngQuest: Kids Edition</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Auto-reload once if a JS module fails to load (e.g., MIME error after new deployment) -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'SCRIPT' && !sessionStorage.getItem('_assetReload')) {
          sessionStorage.setItem('_assetReload', '1');
          setTimeout(function() { location.reload(true); }, 500);
        }
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
