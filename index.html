<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=4" />
    <link rel="shortcut icon" href="/favicon.ico?v=4" />
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon.png?v=4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lexio — English Quest 3000</title>
    <script>
      function triggerHardAssetRecovery(reason) {
        console.warn('[AssetRecovery] Triggering recovery:', reason);
        var lastReload = parseInt(sessionStorage.getItem('asset_reload_time') || '0', 10);
        if (Date.now() - lastReload > 3000) {
          sessionStorage.setItem('asset_reload_time', String(Date.now()));
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          setTimeout(function() {
            window.location.href = window.location.pathname + '?_v=' + Date.now();
          }, 150);
        }
      }

      // 1. Vite preload error
      window.addEventListener('vite:preloadError', function(event) {
        event.preventDefault();
        triggerHardAssetRecovery('vite:preloadError');
      });

      // 2. Unhandled Promise Rejection (dynamic import() MIME / 404 error)
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event && event.reason && (event.reason.message || event.reason.toString())) || '';
        if (msg.includes('dynamically imported module') || msg.includes('Failed to load module') || msg.includes('MIME type') || msg.includes('Importing a module script failed')) {
          event.preventDefault();
          triggerHardAssetRecovery('Dynamic import rejection: ' + msg);
        }
      });

      // 3. Static script tag load failure
      window.addEventListener('error', function(e) {
        if (e && e.target && e.target.tagName === 'SCRIPT' && e.target.src && (e.target.src.includes('/assets/') || e.target.src.includes('chunk') || e.target.src.includes('.js'))) {
          triggerHardAssetRecovery('Script element load error: ' + e.target.src);
        }
      }, true);

      // Clear any leftover mobile debug flag so floating dev tools never appear
      try {
        localStorage.removeItem('debug');
        localStorage.removeItem('eruda');
      } catch(_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        fetch('/version.json?_t=' + Date.now())
          .then(function(r) { return r.json(); })
          .then(function(v) {
            window.__APP_VERSION__ = v;
            window.__GIT_COMMIT__ = v.commit;
            var prevCommit = localStorage.getItem('engquest_last_commit');
            if (prevCommit && v.commit && prevCommit !== v.commit) {
              console.log('[VersionGuard] App update detected:', prevCommit, '->', v.commit);
              localStorage.setItem('engquest_last_commit', v.commit);
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  keys.forEach(function(k) { caches.delete(k); });
                });
              }
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  regs.forEach(function(r) { r.unregister(); });
                });
              }
              window.location.reload(true);
            } else if (v.commit) {
              localStorage.setItem('engquest_last_commit', v.commit);
            }
          })
          .catch(function() {});
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
