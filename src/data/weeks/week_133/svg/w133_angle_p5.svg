<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-label="Four angles around point O summing to 360 degrees">
  <rect width="600" height="260" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <title>Angles Around Point O</title>
  <circle cx="300" cy="132" r="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="300" y1="132" x2="405" y2="132" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="300" y1="132" x2="309.2" y2="27.4" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="300" y1="132" x2="201.3" y2="167.9" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="300" y1="132" x2="344.4" y2="227.2" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="300" cy="132" r="5" fill="#1e293b"/>
  <text x="335.4" y="104.6" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2563eb">85°</text>
  <text x="261.9" y="107.8" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2563eb">115°</text>
  <text x="281.6" y="181.3" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2563eb">95°</text>
  <text x="343.9" y="164.9" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#dc2626">x°</text>
  <text x="485" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Full Turn = 360°</text>
</svg>
