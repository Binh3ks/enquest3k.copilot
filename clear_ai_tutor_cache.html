<!DOCTYPE html>
<html>
<head><title>Clear AI Tutor Cache</title></head>
<body>
<h1>Clear AI Tutor Cache</h1>
<button onclick="clearCache()">Clear Cache & Reload</button>
<pre id="log"></pre>
<script>
function clearCache() {
  const log = document.getElementById('log');
  
  // Clear all localStorage keys related to AI Tutor
  const keys = Object.keys(localStorage);
  const aiTutorKeys = keys.filter(k => 
    k.includes('tutor') || 
    k.includes('mission') || 
    k.includes('story') ||
    k.includes('week-2') ||
    k.includes('ai_story')
  );
  
  log.textContent = 'Clearing keys:\n' + aiTutorKeys.join('\n');
  
  aiTutorKeys.forEach(key => {
    localStorage.removeItem(key);
    log.textContent += '\n✅ Removed: ' + key;
  });
  
  log.textContent += '\n\n🔄 Reloading page...';
  
  setTimeout(() => {
    window.location.href = 'http://localhost:5174/week/2/read_explore';
  }, 1000);
}
</script>
</body>
</html>
